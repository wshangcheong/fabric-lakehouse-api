trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'Azure-CareDoct-Connection'
  resourceGroupName: '<YOUR-RESOURCE-GROUP-NAME>'
  acrName: '<YOUR-ACR-NAME>'
  imageName: 'caredoct-api'
  webAppName: 'caredoct-api'
  apimServiceName: 'caredoct-api-apim'
  apimApiId: '<YOUR-APIM-API-ID>'
  apimApiPath: 'icover'

steps:
  # 1. Build and push Docker image to ACR (tagged with BuildId + latest)
  - task: AzureCLI@2
    displayName: 'Build & Push Image to ACR'
    inputs:
      azureSubscription: '$(azureSubscription)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az acr build \
          --registry "$(acrName)" \
          --image "$(imageName):$(Build.BuildId)" \
          --image "$(imageName):latest" \
          .

  # 2. Point Web App to the new container image tag
  - task: AzureCLI@2
    displayName: 'Deploy Container to Web App'
    inputs:
      azureSubscription: '$(azureSubscription)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az webapp config container set \
          --name "$(webAppName)" \
          --resource-group "$(resourceGroupName)" \
          --container-image-name "$(acrName).azurecr.io/$(imageName):$(Build.BuildId)"

  # 3. Extract openapi.json from FastAPI using uv and sync to APIM
  - script: |
      curl -LsSf https://astral.sh | sh
      export PATH="$HOME/.local/bin:$PATH"
      uv sync --frozen --no-dev
      uv run python -c "import json; from app.main import app; print(json.dumps(app.openapi()))" > $(Build.ArtifactStagingDirectory)/openapi.json
    displayName: 'Generate openapi.json (uv)'


  - task: AzureCLI@2
    displayName: 'Sync OpenAPI Spec to APIM'
    inputs:
      azureSubscription: '$(azureSubscription)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az apim api import \
          --resource-group "$(resourceGroupName)" \
          --service-name "$(apimServiceName)" \
          --api-id "$(apimApiId)" \
          --path "$(apimApiPath)" \
          --specification-format OpenApiJson \
          --specification-path "$(Build.ArtifactStagingDirectory)/openapi.json"
